<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今日热榜">
  <meta name="description" content="百度、微博、头条、华尔街见闻与历史上的今天，一页查看。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>今日热榜</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="brand-copy">
          <div class="eyebrow">DAILY PULSE</div>
          <h1>今日热榜</h1>
        </div>
        <button id="refreshBtn" class="refresh-button" type="button" aria-label="立即刷新" title="立即刷新">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.8 9A7.5 7.5 0 0 1 18 6.2L20 8M4 17v-5h5m10.2 3A7.5 7.5 0 0 1 6 17.8L4 16"/></svg>
        </button>
      </div>
      <div class="header-meta">
        <span id="todayLabel">正在读取日期…</span>
        <span class="meta-dot"></span>
        <span id="lastUpdated">等待数据源</span>
      </div>
    </header>

    <main>
      <section class="source-section" aria-label="热榜来源">
        <div class="section-heading">
          <span class="section-kicker">DISCOVER</span>
          <span class="section-note">选择信息源</span>
        </div>
        <nav id="sourceTabs" class="source-tabs" aria-label="热榜来源切换">
          <button class="source-tab active" data-id="baidu" type="button"><span class="tab-dot baidu"></span>百度</button>
          <button class="source-tab" data-id="weibo" type="button"><span class="tab-dot weibo"></span>微博</button>
          <button class="source-tab" data-id="toutiao" type="button"><span class="tab-dot toutiao"></span>头条</button>
          <button class="source-tab" data-id="wallstreetcn" type="button"><span class="tab-dot wallstreet"></span>华尔街见闻</button>
          <button class="source-tab" data-id="history" type="button"><span class="tab-dot history"></span>历史上的今天</button>
          <button class="source-tab" data-id="history_wiki" type="button"><span class="tab-dot wiki"></span>维基百科</button>
        </nav>
      </section>

      <section class="board-card" aria-live="polite">
        <div class="board-heading">
          <div class="board-title-wrap">
            <div class="board-overline"><span class="live-indicator"></span><span id="sourceEyebrow">BAIDU TRENDING</span></div>
            <h2 id="boardTitle">百度热搜</h2>
          </div>
          <div class="board-count" id="boardCount">— 条</div>
        </div>
        <div class="board-status-row">
          <p id="statusText" class="status-text">正在获取榜单…</p>
          <button id="retryBtn" class="retry-button" type="button" hidden>重试</button>
        </div>
        <ol id="trendList" class="trend-list"></ol>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-symbol">↻</div>
          <strong>暂时没有获取到内容</strong>
          <span>检查网络后再试一次。</span>
        </div>
        <div id="cacheNotice" class="cache-notice" hidden>当前展示的是上次成功获取的缓存</div>
      </section>

      <section class="footnote-card">
        <div class="footnote-icon">i</div>
        <div>
          <strong>信息聚合，不代表立场</strong>
          <p>内容来自公开信息源，点击标题可查看原始页面。榜单热度与排序以来源页面为准。</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>自动刷新间隔 5 分钟</span>
      <span class="footer-divider">·</span>
      <span id="refreshState">页面打开时更新</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
